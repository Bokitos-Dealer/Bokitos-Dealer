<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Shop admin – Bokitos Air</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a6cff'/%3E%3C/svg%3E">
</head>
<body class="admin">
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M16 6v20M7.3 11l17.4 10M7.3 21l17.4-10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg><span>Bokitos<b>Air</b> admin</span></a>
      <div class="header-actions">
        <button class="btn btn-ghost sm-text" id="refreshBtn" hidden>Refresh</button>
        <button class="btn btn-ghost sm-text" id="logoutBtn" hidden>Log out</button>
      </div>
    </div>
  </header>

  <main class="container admin-main">
    <form id="loginForm" class="login calc-card">
      <h2>Sign in</h2>
      <label><span>Admin password</span><input type="password" id="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p class="form-status err" id="loginStatus"></p>
    </form>

    <div id="app" hidden>
      <div class="stats" id="stats"></div>
      <div class="admin-bar">
        <div class="chips" role="tablist">
          <button class="chip active" data-tab="orders">Orders</button>
          <button class="chip" data-tab="quotes">Quote requests</button>
        </div>
        <div class="filter-selects">
          <input type="search" id="adminSearch" class="search" placeholder="Search name, email, ID…">
          <select id="statusFilter"></select>
          <button class="btn btn-ghost sm-text" id="csvBtn">Export CSV</button>
        </div>
      </div>
      <div class="table-wrap"><table class="admin-table" id="table"></table></div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="admin.js"></script>
</body>
</html>
